name: Update Scholar Stats

on:
  schedule:
    - cron: "0 0 * * 0" # Runs once a week on Sunday
  workflow_dispatch:     # Allows manual run from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install scholarly
        run: pip install scholarly

      - name: Run script
        run: python .github/scripts/update_scholar.py

      - name: Commit SVG
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add scholar-stats.svg
          git commit -m "Update Scholar Stats SVG" || exit 0
          git push