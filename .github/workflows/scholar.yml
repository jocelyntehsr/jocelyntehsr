name: Google Scholar Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:     # Allows manual trigger from Actions tab

jobs:
  scholar-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Google Scholar Stats
        uses: jonasbn/github-action-google-scholar-stats@v1
        with:
          scholar_id: fTTCTdIAAAAJ  # Replace with your actual Google Scholar ID
          
      - name: Commit and Push SVG
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Update Scholar Stats" || exit 0
          git push